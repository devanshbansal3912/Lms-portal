app:
  description: 'AI-Powered LMS - Single-Shot Flashcard Generation Workflow from Study Material'
  icon: '🗂️'
  icon_background: '#E0EAFF'
  mode: workflow
  name: LMS Flashcard Generation Workflow
kind: app
version: 0.1.3
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
  graph:
    edges:
      - id: edge-start-to-retrieval
        source: start-node
        target: knowledge-retrieval-node
      - id: edge-retrieval-to-llm
        source: knowledge-retrieval-node
        target: llm-flashcard-node
      - id: edge-llm-to-end
        source: llm-flashcard-node
        target: end-node
    nodes:
      - id: start-node
        data:
          title: Start
          type: start
          variables:
            - label: document_id
              max_length: 100
              options: []
              required: true
              type: text-input
              variable: document_id
            - label: topic
              max_length: 100
              options: []
              required: true
              type: text-input
              variable: topic
            - label: num_cards
              max_length: 10
              options: []
              required: true
              type: number
              variable: num_cards
        position:
          x: 100
          y: 200
        type: custom

      - id: knowledge-retrieval-node
        data:
          title: Knowledge Retrieval
          type: knowledge-retrieval
          query_variable_selector:
            - start-node
            - topic
          dataset_ids: []
          retrieval_mode: semantic
          top_k: 5
          score_threshold: 0.4
        position:
          x: 400
          y: 200
        type: custom

      - id: llm-flashcard-node
        data:
          title: LLM Flashcard Extractor
          type: llm
          model:
            provider: anthropic
            name: claude-3-5-sonnet-20241022
            mode: chat
            completion_params:
              temperature: 0.2
              max_tokens: 3000
          prompt_template:
            - role: system
              text: |
                You are an expert educational study card creator.
                Your goal is to extract high-yield concept-explanation pairs from study documents.

                RULES:
                1. Output ONLY valid JSON matching the exact schema below. Do not output markdown fences or commentary.
                2. Generate exactly {{#start-node.num_cards#}} flashcards for topic "{{#start-node.topic#}}".
                3. "front" must be a concise, direct question or concept name.
                4. "back" must be a clear, grounded explanation or definition citing the context facts.

                SCHEMA:
                {
                  "title": "Study Deck: {{#start-node.topic#}}",
                  "cards": [
                    {
                      "front": "What is ...?",
                      "back": "A state where..."
                    }
                  ]
                }
            - role: user
              text: |
                Context retrieved from study document:
                {{#knowledge-retrieval-node.result#}}

                Generate {{#start-node.num_cards#}} flashcards for topic: {{#start-node.topic#}}.
        position:
          x: 750
          y: 200
        type: custom

      - id: end-node
        data:
          title: End Output
          type: end
          outputs:
            - value_selector:
                - llm-flashcard-node
                - text
              variable: result
        position:
          x: 1100
          y: 200
        type: custom
